  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #10b981;
      --primary-hover: #059669;
      --accent-purple: #a855f7;
      --accent-amber: #f59e0b;
      --accent-blue: #38bdf8;
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding-bottom: 80px;
    }
    header {
      background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
      border-bottom: 1px solid var(--border);
      padding: 20px 16px;
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(8px);
    }
    .header-content {
      max-width: 900px;
      margin: 0 auto;
    }
    .badge-brand {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid rgba(16, 185, 129, 0.3);
      margin-bottom: 8px;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #fff;
    }
    p.subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }
    .stats-bar {
      display: flex;
      gap: 8px;
      margin-top: 14px;
      flex-wrap: wrap;
    }
    .stat-pill {
      background: #1e293b;
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .stat-pill strong { color: #fff; }
    .stat-pill.verified {
      border-color: rgba(16, 185, 129, 0.4);
      background: rgba(16, 185, 129, 0.1);
      color: #34d399;
    }
    .controls-section {
      max-width: 900px;
      margin: 16px auto;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .search-input {
      width: 100%;
      background: #1e293b;
      border: 1px solid var(--border);
      color: #fff;
      padding: 12px 16px;
      border-radius: var(--radius);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-input:focus { border-color: var(--primary); }
    .filter-group {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .filter-group::-webkit-scrollbar { display: none; }
    .filter-chip {
      background: #1e293b;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .filter-chip.active {
      background: var(--primary);
      color: #0f172a;
      border-color: var(--primary);
    }
    .grid {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: transform 0.15s, border-color 0.2s;
    }
    .card.visited {
      opacity: 0.65;
      border-left: 4px solid var(--primary);
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }
    .card-title {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
    }
    .card-badges {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
      white-space: nowrap;
    }
    .badge-verified { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.4); }
    .badge-tequenos { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.4); }
    .badge-prospect { background: rgba(148, 163, 184, 0.15); color: #94a3b8; border: 1px solid rgba(148, 163, 184, 0.3); }
    .badge-arcon { background: rgba(56, 189, 248, 0.15); color: #7dd3fc; border: 1px solid rgba(56, 189, 248, 0.3); }

    .card-address {
      font-size: 13px;
      color: var(--text-muted);
      display: flex;
      align-items: flex-start;
      gap: 6px;
      margin-top: 2px;
    }
    .city-tag {
      background: rgba(255,255,255,0.06);
      color: #cbd5e1;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
      font-size: 11px;
    }
    .card-pitch {
      background: rgba(0,0,0,0.25);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 12px;
      color: #e2e8f0;
      border-left: 3px solid var(--primary);
    }
    .card-pitch strong {
      display: block;
      margin-bottom: 2px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .card-pitch.highlight-acai { border-left-color: #10b981; }
    .card-pitch.highlight-acai strong { color: #34d399; }
    .card-pitch.highlight-tequenos { border-left-color: #f59e0b; }
    .card-pitch.highlight-tequenos strong { color: #fbbf24; }
    .card-pitch.highlight-prospect { border-left-color: #94a3b8; }
    .card-pitch.highlight-prospect strong { color: #cbd5e1; }
    .card-pitch.highlight-arcon { border-left-color: #38bdf8; }
    .card-pitch.highlight-arcon strong { color: #7dd3fc; }

    .card-actions {
      display: flex;
      gap: 8px;
      margin-top: 4px;
      flex-wrap: wrap;
    }
    .btn-maps {
      flex: 1;
      min-width: 140px;
      background: #2563eb;
      color: #fff;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      transition: background 0.2s;
    }
    .btn-maps:hover { background: #1d4ed8; }
    .btn-status {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn-status.done {
      border-color: var(--primary);
      color: var(--primary);
      background: rgba(16, 185, 129, 0.1);
    }
    .empty-state {
      text-align: center;
      padding: 40px 16px;
      color: var(--text-muted);
    }
  </style>
</head>

    let visitedState = JSON.parse(localStorage.getItem('fuconsa_visited') || '{}');
    let currentCity = 'all';
    let currentType = 'all';
    let searchQuery = '';

    function updateStats() {
      const total = PLACES.length;
      const visited = Object.values(visitedState).filter(Boolean).length;
      const verified = PLACES.filter(p => p.status === 'acai-verified').length;
      const tequenos = PLACES.filter(p => p.status === 'tequenos-verified').length;
      
      document.getElementById('totalCount').textContent = total;
      document.getElementById('verifiedCount').textContent = verified;
      document.getElementById('tequenosCount').textContent = tequenos;
      document.getElementById('visitedCount').textContent = visited;
    }

    function toggleVisited(id) {
      visitedState[id] = !visitedState[id];
      localStorage.setItem('fuconsa_visited', JSON.stringify(visitedState));
      updateStats();
      render();
    }

    function render() {
      const container = document.getElementById('placesGrid');
      const filtered = PLACES.filter(p => {
        const matchCity = currentCity === 'all' || p.city === currentCity;
        const matchType = currentType === 'all' || p.status === currentType;
        const q = searchQuery.toLowerCase().trim();
        const matchSearch = !q || p.name.toLowerCase().includes(q) || p.address.toLowerCase().includes(q) || p.city.toLowerCase().includes(q) || p.pitch.toLowerCase().includes(q);
        return matchCity && matchType && matchSearch;
      });

      if (filtered.length === 0) {
        container.innerHTML = '<div class="empty-state">No se encontraron comercios con esos filtros.</div>';
        return;
      }

      container.innerHTML = filtered.map(p => {
        const isDone = !!visitedState[p.id];
        const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.mapsQuery)}`;
        return `
          <article class="card ${isDone ? 'visited' : ''}">
            <div class="card-header">
              <div>
                <h2 class="card-title">${p.name}</h2>
                <div class="card-address">
                  <span class="city-tag">${p.city}</span>
                  <span>${p.address}</span>
                </div>
              </div>
              <div class="card-badges">
                <span class="badge ${p.badgeClass}">${p.badgeText}</span>
              </div>
            </div>

            <div class="card-pitch ${p.pitchClass}">
              <strong>${p.pitchHeader}</strong>
              ${p.pitch}
            </div>

            <div class="card-actions">
              <a href="${mapsUrl}" target="_blank" rel="noopener noreferrer" class="btn-maps">
                📍 Abrir en Google Maps
              </a>
              <button class="btn-status ${isDone ? 'done' : ''}" onclick="toggleVisited('${p.id}')">
                ${isDone ? '✓ Visitado' : '○ Marcar visitado'}
              </button>
            </div>
          </article>
        `;
      }).join('');
    }

    // Event Listeners
    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value;
      render();
    });

    document.querySelectorAll('#cityFilters .filter-chip').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#cityFilters .filter-chip').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentCity = btn.dataset.city;
        render();
      });
    });

    document.querySelectorAll('#typeFilters .filter-chip').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#typeFilters .filter-chip').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentType = btn.dataset.type;
        render();
      });
    });

    // Init
    updateStats();
    render();
  </script>
